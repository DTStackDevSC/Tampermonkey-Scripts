name: Config Editor

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to publish
        default: Config Editor/ConfigEditor.App
  push:
    tags:
      - 'config-editor-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT: ${{ inputs.project || 'Config Editor/ConfigEditor.App' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        if: hashFiles('Config Editor/ConfigEditor.sln') != ''
        run: dotnet test "Config Editor/ConfigEditor.sln" -c Release

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish "$env:PROJECT" -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: config-editor
          path: publish/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/config-editor-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem publish/*.exe).FullName --title "Config Editor ${{ github.ref_name }}" --notes "Download the exe and run it. No install needed."
