name: Suite checks

on:
  push:
    paths:
      - 'Toolbar Scripts/**'
      - 'Standalone Scripts/**'
      - '.github/scripts/check-suites.js'
      - '.github/workflows/suite-checks.yml'
  pull_request:
    paths:
      - 'Toolbar Scripts/**'
      - 'Standalone Scripts/**'
      - '.github/scripts/check-suites.js'
      - '.github/workflows/suite-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax, versions, changelogs and version bump
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/check-suites.js "$BASE"
